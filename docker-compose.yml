services:
  app:
    build: .
    container_name: concept_components_dev
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ../concept-core-2:/var/www/concept-core-2
      - ../concept-extensions:/var/www/concept-extensions
      # Optional: run / inspect assemblies that consume components via path
      - ../concept-apps:/var/www/concept-apps
    environment:
      COMPOSER_HOME: /tmp/composer
    command: sleep infinity
